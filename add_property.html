<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimePlots - Add you propery and contact section</title>
  <style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.add-property-section {
  padding: 70px 80px;
  background: #1a1a1a;
  margin: 40px auto;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  max-width: 1200px;
  border: 1px solid #2a2a2a;
}

.add-property-section h2 {
  text-align: center;
  margin-bottom: 40px;
  color: #ff6b35;
  font-size: 32px;
  font-weight: 700;
}

.add-property-section h2::after {
  content: '';
  display: block;
  width: 80px;
  height: 4px;
  background: #ff6b35;
  margin: 15px auto;
  border-radius: 2px;
}

form {
  display: flex;
  flex-direction: column;
  max-width: 600px;
  margin: 0 auto;
  gap: 15px;
}

form input,
form select,
form textarea {
  padding: 14px;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  font-size: 15px;
  width: 100%;
  background: #0f0f0f;
  color: #e0e0e0;
  transition: all 0.3s ease;
}

form input:focus,
form select:focus,
form textarea:focus {
  outline: none;
  border-color: #ff6b35;
  background: #1a1a1a;
  box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
  transform: translateY(-2px);
}

form button {
  background: #ff6b35;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

form button:hover {
  background: #e55a2b;
  transform: translateY(-3px);
}

footer {
  background: #1a1a1a;
  color: white;
  text-align: center;
  padding: 30px;
  margin-top: 60px;
  font-size: 15px;
  border-top: 1px solid #2a2a2a;
}

img {
  display: block;
}
</style>

<section class="add-property-section">
  <h2>Add Your Property</h2>

  <form>
    <input type="text" placeholder="Owner Name" required>
    <input type="email" placeholder="Email" required>
    <input type="text" placeholder="Property Title" required>
    <input type="text" placeholder="City / Location" required>

    <select required>
      <option value="">Select BHK Type</option>
      <option>1 BHK</option>
      <option>2 BHK</option>
      <option>3 BHK</option>
      <option>4 BHK</option>
    </select>

    <input type="text" placeholder="Price (₹)" required>
    <textarea rows="4" placeholder="Property Description"></textarea>

    <button type="submit">Submit Property</button>
  </form>
</section>
